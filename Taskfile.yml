version: '3'

vars:
  BINARY: tock
  OUTPUT_DIR: output

tasks:
  default:
    desc: List available commands
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the binary
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.OUTPUT_DIR}}/{{.BINARY}}"
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - CGO_ENABLED=0 go build -o {{.OUTPUT_DIR}}/{{.BINARY}} .

  test:
    desc: Run tests
    cmds:
      - CGO_ENABLED=0 go test --shuffle on -v ./...

  run:
    desc: Run with default config
    deps: [build]
    cmds:
      - ./{{.OUTPUT_DIR}}/{{.BINARY}} {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.OUTPUT_DIR}}
